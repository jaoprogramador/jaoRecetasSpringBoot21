server.port=8090

# Configuracion de la base de datos H2
#spring.datasource.url=jdbc:h2:tcp://localhost:9092/mem:recetas_bd;MODE=PostgreSQL
spring.datasource.url=jdbc:h2:mem:recetas_bd;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicializacion de la base datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.flyway.enabled=false