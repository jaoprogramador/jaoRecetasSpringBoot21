spring.application.name=jaoRestaurante
server.port=8090

# Expone todos los endpoints
management.endpoints.web.exposure.include=*

# Habilita explícitamente los endpoints individuales
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.info.enabled=true

# Habilita el mapeo de las propiedades info.*
management.info.env.enabled=true

# Información personalizada
info.app.name=jaoRestaurante
info.app.version=1.0.0
info.app.description=Aplicación que demuestra el uso de DevTools y Actuator
# Configuración de la base de datos postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/recetas_bd
spring.datasource.username=postgres
spring.datasource.password=mi_clave_secreta
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuración de la base de datos MySQL
#spring.datasource.url=jdbc:mysql://192.168.1.70:3306/springboot
